name: Publish DevTalk CLI

on:
  push:
    branches:
      - main
    paths:
      - client/**
      - .github/workflows/publish-client.yml

jobs:
  publish:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine release type
        id: release_type
        shell: bash
        run: |
          RELEASE_TYPE="patch"
          COMMIT_MESSAGE="${{ github.event.head_commit.message || '' }}"

          if [[ "$COMMIT_MESSAGE" == *"BREAKING CHANGE"* || "$COMMIT_MESSAGE" == *"!"* ]]; then
            RELEASE_TYPE="major"
          elif [[ "$COMMIT_MESSAGE" == feat:* || "$COMMIT_MESSAGE" == *"feat("* ]]; then
            RELEASE_TYPE="minor"
          elif [[ "$COMMIT_MESSAGE" == refactor:* || "$COMMIT_MESSAGE" == *"refactor("* ]]; then
            RELEASE_TYPE="patch"
          elif [[ "$COMMIT_MESSAGE" == fix:* || "$COMMIT_MESSAGE" == *"fix("* ]]; then
            RELEASE_TYPE="patch"
          fi

          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"

      - name: Bump version
        run: npm version "${{ steps.release_type.outputs.release_type }}" --no-git-tag-version

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): bump client version [skip ci]"
          git push